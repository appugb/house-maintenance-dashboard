<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>House Maintenance Dashboard</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="layout">

<header>

<div>
<h1>🏠 House Maintenance</h1>
<p>Your property ownership dashboard</p>
</div>

<div class="last-updated">
<span id="lastUpdated"></span>
</div>

</header>

<section class="kpis">

<div class="kpi-card">
<span>Lifetime Spend</span>
<h2 id="totalSpend">$0</h2>
</div>

<div class="kpi-card">
<span>This Year</span>
<h2 id="yearSpend">$0</h2>
</div>

<div class="kpi-card">
<span>Expenses Logged</span>
<h2 id="expenseCount">0</h2>
</div>

<div class="kpi-card">
<span>Largest Expense</span>
<h2 id="largestExpense">$0</h2>
</div>

</section>

<section class="dashboard-grid">

<div class="panel">
<h3>Spend by Category</h3>
<canvas id="categoryChart"></canvas>
</div>

<div class="panel">
<h3>Monthly Spend Trend</h3>
<canvas id="monthlyChart"></canvas>
</div>

<div class="panel">
<h3>Recent Activity</h3>
<div id="activityFeed"></div>
</div>

<div class="panel">
<h3>Maintenance Tasks</h3>
<div id="maintenanceFeed"></div>
</div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
