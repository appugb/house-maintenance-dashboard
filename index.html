<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>House Maintenance</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-950 text-white">

<div class="max-w-7xl mx-auto p-6">

    <div class="mb-8">

        <h1 class="text-4xl font-bold">
            🏠 House Maintenance
        </h1>

        <p class="text-slate-400 mt-2">
            Property ownership dashboard
        </p>

    </div>

    <div class="grid grid-cols-3 gap-5 mb-6">

        <div class="bg-slate-900 rounded-3xl p-6">
            <div class="text-slate-400">
                Lifetime Spend
            </div>

            <div
                class="text-4xl font-bold mt-2"
                id="totalSpend">
            </div>
        </div>

        <div class="bg-slate-900 rounded-3xl p-6">
            <div class="text-slate-400">
                Largest Expense
            </div>

            <div
                class="text-4xl font-bold mt-2"
                id="largestExpense">
            </div>
        </div>

        <div class="bg-slate-900 rounded-3xl p-6">
            <div class="text-slate-400">
                This Year
            </div>

            <div
                class="text-4xl font-bold mt-2"
                id="yearSpend">
            </div>
        </div>

    </div>

    <div class="grid grid-cols-3 gap-5">

        <div class="col-span-2 bg-slate-900 rounded-3xl p-5">

            <h3 class="mb-4 text-slate-300">
                Monthly Spend
            </h3>

            <canvas id="monthlyChart"></canvas>

        </div>

        <div class="bg-slate-900 rounded-3xl p-5">

            <h3 class="mb-4 text-slate-300">
                Categories
            </h3>

            <canvas id="categoryChart"></canvas>

        </div>

        <div class="col-span-2 bg-slate-900 rounded-3xl p-5">

            <h3 class="mb-4 text-slate-300">
                Recent Activity
            </h3>

            <div id="activityFeed"></div>

        </div>

        <div class="bg-slate-900 rounded-3xl p-5">

            <h3 class="mb-4 text-slate-300">
                Maintenance
            </h3>

            <div id="maintenanceFeed"></div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
