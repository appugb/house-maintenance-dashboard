<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Maintenance Dashboard</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <h1>🏠 House Maintenance Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Spend</h3>
            <p id="totalSpend">$0</p>
        </div>

        <div class="card">
            <h3>This Year</h3>
            <p id="yearSpend">$0</p>
        </div>

        <div class="card">
            <h3>Expenses</h3>
            <p id="expenseCount">0</p>
        </div>

        <div class="card">
            <h3>Contractors</h3>
            <p id="contractorCount">0</p>
        </div>

    </div>

    <div class="chart-container">
        <h2>Spend by Category</h2>
        <canvas id="categoryChart"></canvas>
    </div>

    <div class="chart-container">
        <h2>Annual Spend</h2>
        <canvas id="yearChart"></canvas>
    </div>

    <div class="table-container">
        <h2>Top Expenses</h2>

        <table id="expenseTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Cost</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
